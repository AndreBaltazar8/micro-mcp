name: Stage npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-stage-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  stage:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install an npm CLI with staged publishing
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Match the package version to the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
      - name: Stage the public package with npm OIDC
        run: npm stage publish --access public
